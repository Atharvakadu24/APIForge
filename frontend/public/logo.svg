<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="apiforge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient -->
    <linearGradient id="apiforge-primary-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#00A3FF" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Vibrant Indigo to Violet Gradient for Accent Pill -->
    <linearGradient id="apiforge-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Container App Icon Frame (Optional for Icon view, toggleable or standalone) -->
  <rect width="100" height="100" rx="24" fill="url(#apiforge-bg)" stroke="#1E293B" stroke-width="2" />

  <!-- Main Forge "A" Glyph with Dynamic Crossbar Notch -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 50 18
       C 51.5 18 52.8 18.8 53.6 20.2
       L 66.5 45.5
       C 67.2 46.9 66.4 48.5 64.8 48.8
       L 56.5 50.2
       C 54.8 50.5 53.8 52.2 54.5 53.8
       L 46.8 77.2
       C 46.2 78.8 44.0 79.1 43.1 77.6
       L 37.2 67.8
       C 36.5 66.6 35.1 66.0 33.7 66.4
       L 26.5 68.5
       C 24.5 69.1 22.8 67.4 23.3 65.4
       L 46.4 20.2
       C 47.2 18.8 48.5 18 50 18 Z
       M 49.8 32
       C 49.3 32 48.9 32.3 48.7 32.8
       L 39.5 52.5
       C 39.1 53.3 39.7 54.2 40.6 54.2
       L 55.4 54.2
       C 56.3 54.2 56.9 53.3 56.5 52.5
       L 50.9 32.8
       C 50.7 32.3 50.3 32 49.8 32 Z"
    fill="url(#apiforge-primary-grad)"
  />

  <!-- Accent Lower-Right Foot (Detached Angled Violet Capsule) -->
  <rect
    x="60.5"
    y="56"
    width="12.5"
    height="24"
    rx="6.25"
    transform="rotate(-28 66.75 68)"
    fill="url(#apiforge-accent-grad)"
  />
</svg>
